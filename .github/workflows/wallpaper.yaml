name: weekly image rotator

on:
  schedule:
    - cron: '0 23 * * 6'
  workflow_dispatch: 

jobs:
  update-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pick random image and replace
        run: |
          # 1. Configuration: Change these variables to match your setup
          SOURCE_DIR="./wallpapers"
          TARGET_FILE="./nixos/configuration/wallpaper.png"
          
          # 2. Find all images (jpg, png, jpeg) in the directory and pick one randomly
          RANDOM_IMAGE=$(find "$SOURCE_DIR" -type f \( -iname \*.jpg -o -iname \*.png -o -iname \*.jpeg \) | shuf -n 1)
          
          # 3. Check if an image was actually found
          if [ -z "$RANDOM_IMAGE" ]; then
            echo "Error: No images found in $SOURCE_DIR"
            exit 1
          fi
          
          echo "Selected random image: $RANDOM_IMAGE"
          
          # 4. Overwrite the target file with the selected image
          cp "$RANDOM_IMAGE" "$TARGET_FILE"

      - name: Create Pull Request
        id: wallpaper_shuffle
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore: rotate weekly wallpaper"
          title: "chore: rotate weekly wallpaper"
          body: "Automated weekly wallpaper rotation."
          branch: "rotate-wallpaper"
          delete-branch: true
          labels: |
            automated

      - name: Enable auto-merge
        if: steps.wallpaper_shuffle.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh pr merge --auto --squash "${{ steps.wallpaper_shuffle.outputs.pull-request-url }}"